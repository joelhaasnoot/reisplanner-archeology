# DOSBox-X config for debugging REISPLAN.EXE.
# Launch from the repository root:
#   xvfb-run -a tools/dosbox-x -conf tools/dosbox-x.conf
# Paths below are relative to the repository root.

[sdl]
output=surface
autolock=false
waitonerror=true

[dosbox]
machine=svga_s3
memsize=16
captures=work/capture

# The heavy debugger requires the normal (interpreted) core.
# The dynamic/simple cores do not honour breakpoints reliably.
[cpu]
core=normal
cputype=386
cycles=fixed 3000

[dos]
# Mirror the guest's CON output into the log, so the planner's own screens are
# captured as text (ground truth) and AUTOTYPE problems are visible.
log console=true

[render]
frameskip=0

[speaker]
pcspeaker=false

[mixer]
nosound=true

[autoexec]
# C: is the source material, mounted READ-ONLY so debugging cannot modify it.
mount c "input/90-91" -ro
# D: is scratch space for anything the session writes.
mount d "work"
c:
